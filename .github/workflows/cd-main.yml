name: CD - Main Branch Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env files from Secrets
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > ./backend/.env
          echo "REACT_APP_API_URL=${{ secrets.API_URL }}" > ./frontend/.env
        continue-on-error: true

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/node-backend:latest
        continue-on-error: true

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/node-frontend:latest
        continue-on-error: true