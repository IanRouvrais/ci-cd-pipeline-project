name: CI - Dev Branch Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./${{ matrix.folder }}

      - name: Run Linting
        run: npm run lint
        working-directory: ./${{ matrix.folder }}

      - name: Run NPM Audit
        run: npm audit
        working-directory: ./${{ matrix.folder }}

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          directory: ./${{ matrix.folder }}

      - name: Execute Tests
        run: npm test
        working-directory: ./${{ matrix.folder }}

      - name: Build Docker Images (Verification)
        run: docker build -t test-image-${{ matrix.folder }} .
        working-directory: ./${{ matrix.folder }}